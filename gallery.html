<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Five-image gallery for my personal portfolio">
    <title>My Portfolio | Image Gallery</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Image Gallery</h1>
        <p>A collection of five portfolio images</p>
    </header>

    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="hobbies.html">Hobbies</a>
        <a href="skills.html">Personal Skills</a>
        <a class="active" href="gallery.html">Image Gallery</a>
        <a href="contact.html">Contact Me</a>
    </nav>

    <main class="container">
        <h2>My Favorite Images</h2>
        <p>The images below are arranged using CSS <strong>float</strong>. The gallery container uses <strong>overflow</strong> and the page footer uses <strong>clear</strong> to keep the layout organized.</p>

        <div class="gallery">
            <figure class="gallery-item">
                <img src="images/image1.jpg" alt="Nature scene">
                <figcaption>Nature</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/image2.jpg" alt="Technology scene">
                <figcaption>Technology</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/image3.jpg" alt="Travel scene">
                <figcaption>Travel</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/image4.jpg" alt="Books and reading">
                <figcaption>Books</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="images/image5.jpg" alt="City scene">
                <figcaption>City</figcaption>
            </figure>
        </div>

        <div class="clear"></div>
    </main>

    <footer>
        <p></p>
    </footer>
</body>
</html>
