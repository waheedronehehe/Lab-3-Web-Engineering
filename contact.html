<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>My Portfolio | Contact Me</title>
    <link rel="stylesheet" href="css/style.css">

<body>
    <header>
        <h1>Contact Me</h1>
        <p>Get in touch</p>

    <nav aria-label="Main navigation">

    <main class="container">
        <section>
            <h2>Get in Touch</h2>
            <p>You can use the information below to contact me.</p>
            <ul class="info-list">
                <li><strong>Email:</strong> anas@mail.com</li>
                <li><strong>Phone:</strong> +92 300 1234567</li>
                <li><strong>Location:</strong> Pakistan</li>
            </ul>
        </section>

        <section>
            <h2>Contact Form</h2>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Write your message" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p></p>
    </footer>
